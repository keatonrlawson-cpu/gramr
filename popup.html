<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gramr</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">G</div>
        <div class="logo-text">
          <span class="logo-name">Gramr</span>
          <span class="logo-tagline">Grammar Coach</span>
        </div>
      </div>
      <label class="toggle" title="Enable / disable Gramr">
        <input type="checkbox" id="enableToggle" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </header>

    <!-- Stats bar -->
    <section class="stats" id="statsSection">
      <div class="stat stat--error" id="statErrors">
        <span class="stat-num" id="errCount">0</span>
        <span class="stat-label">Errors</span>
      </div>
      <div class="stat stat--warning" id="statWarnings">
        <span class="stat-num" id="warnCount">0</span>
        <span class="stat-label">Warnings</span>
      </div>
      <div class="stat stat--info" id="statInfo">
        <span class="stat-num" id="infoCount">0</span>
        <span class="stat-label">Tips</span>
      </div>
    </section>

    <!-- Progress: level, XP, streak -->
    <section class="progress" id="progressSection">
      <div class="progress-top">
        <span class="progress-title" id="levelTitle">Novice</span>
        <span class="progress-streak" id="streakBadge" hidden>🔥 <span id="streakDays">0</span>-day streak</span>
        <span class="progress-xp" id="xpText">0 XP</span>
      </div>
      <div class="xp-bar">
        <div class="xp-bar-fill" id="xpBarFill"></div>
      </div>
      <div class="progress-sub" id="xpNext"></div>
    </section>

    <!-- Status message -->
    <div class="status-msg" id="statusMsg">
      <span id="statusText">Click a text field and start typing to get feedback.</span>
    </div>

    <!-- Focus of the week -->
    <section class="focus-card" id="focusCard" hidden>
      <div class="focus-head">🎯 This week's focus</div>
      <div class="focus-rule" id="focusRule"></div>
      <p class="focus-lesson" id="focusLesson"></p>
      <p class="focus-trick" id="focusTrick"></p>
    </section>

    <!-- Dialect selector -->
    <section class="setting-row">
      <label class="setting-label" for="dialectSelect">English variant</label>
      <select class="setting-select" id="dialectSelect">
        <option value="us">🇺🇸 American</option>
        <option value="uk">🇬🇧 British</option>
        <option value="au">🇦🇺 Australian</option>
        <option value="ca">🇨🇦 Canadian</option>
      </select>
    </section>

    <!-- Per-site disable -->
    <section class="setting-row" id="siteRow" hidden>
      <label class="setting-label" for="siteToggle">Disable on <span id="siteHost"></span></label>
      <label class="toggle toggle--small" title="Disable Gramr on this site">
        <input type="checkbox" id="siteToggle" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </section>

    <!-- Mistake history -->
    <section class="history-section" id="historySection" hidden>
      <div class="section-head">
        <h2 class="section-title">Your most common mistakes</h2>
        <button class="clear-btn" id="clearHistory" title="Clear history">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <div class="history-applied" id="historyApplied"></div>
    </section>

    <!-- Rule list -->
    <section class="rules-section">
      <h2 class="section-title">What Gramr checks <span class="section-hint">(click to toggle)</span></h2>
      <ul class="rule-list" id="ruleList"></ul>
    </section>

    <!-- Options -->
    <section class="options-section">
      <details class="options">
        <summary>Options</summary>
        <label class="opt-row"><input type="checkbox" id="optGamification" checked /> XP, levels &amp; streaks</label>
        <label class="opt-row"><input type="checkbox" id="optBadges" checked /> Mastery badges (🌱📈⭐)</label>
        <label class="opt-row"><input type="checkbox" id="optFocus" checked /> Focus of the week</label>
        <label class="opt-row"><input type="checkbox" id="optHistory" checked /> Mistake history</label>
        <label class="opt-row"><input type="checkbox" id="optAdaptive" checked /> Adaptive tooltips (shorter as you improve)</label>
      </details>
    </section>

    <!-- About -->
    <footer class="footer">
      Gramr teaches grammar — it won't rewrite your text for you.
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
